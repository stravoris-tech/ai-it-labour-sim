name: numerics-probe

# Temporary (slice 03b): samples GitHub's runners to test whether numpy's AVX-512 kernels break batch parity, and
# whether NPY_DISABLE_CPU_FEATURES restores it. Each job runs the probe and the parity tests with and without it.
on:
  push:
    branches: ["feature/ci-numerics"]

jobs:
  probe:
    name: probe ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Sync dependencies
        run: |
          uv sync --locked
          mkdir -p temp/probe

      - name: Probe (default)
        id: probe_default
        if: always()
        run: |
          set +e
          uv run --frozen python tools/numerics_probe.py --end-to-end --json temp/probe/default.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Parity (default)
        id: parity_default
        if: always()
        run: |
          set +e
          uv run --frozen python -m pytest tests/test_batch_parity.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Disable list
        id: list
        if: always()
        run: |
          set +e
          list=$(uv run --frozen python -c "import importlib; m = importlib.import_module('numpy._core._multiarray_umath'); print(' '.join(f for f in m.__cpu_dispatch__ if f.startswith('AVX512')))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          if [ -z "$list" ]; then echo "nothing to disable"; else echo "disabling: $list"; fi
          NPY_DISABLE_CPU_FEATURES="$list" uv run --frozen python -W always -c "import importlib; m = importlib.import_module('numpy._core._multiarray_umath'); print('AVX512 features on:', sorted(k for k, v in m.__cpu_features__.items() if v and k.startswith('AVX512')))" 2> temp/probe/import.err
          code=$?
          echo "import exit code: $code"
          echo "import stderr:"
          cat temp/probe/import.err
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Probe (disabled)
        id: probe_disabled
        if: always()
        env:
          NPY_DISABLE_CPU_FEATURES: ${{ steps.list.outputs.list }}
        run: |
          set +e
          uv run --frozen python tools/numerics_probe.py --end-to-end --json temp/probe/disabled.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Parity (disabled)
        id: parity_disabled
        if: always()
        env:
          NPY_DISABLE_CPU_FEATURES: ${{ steps.list.outputs.list }}
        run: |
          set +e
          uv run --frozen python -m pytest tests/test_batch_parity.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Summary
        if: always()
        env:
          DISABLED: ${{ steps.list.outputs.list }}
          IMPORT_CODE: ${{ steps.list.outputs.code }}
          PROBE_DEFAULT: ${{ steps.probe_default.outputs.code }}
          PARITY_DEFAULT: ${{ steps.parity_default.outputs.code }}
          PROBE_DISABLED: ${{ steps.probe_disabled.outputs.code }}
          PARITY_DISABLED: ${{ steps.parity_disabled.outputs.code }}
        run: |
          uv run --frozen python - <<'EOF'
          import json, os, pathlib

          def load(name):
              p = pathlib.Path("temp/probe") / name
              return json.loads(p.read_text(encoding="utf-8")) if p.exists() else None

          default, disabled = load("default.json"), load("disabled.json")
          err = pathlib.Path("temp/probe/import.err")
          env = (default or disabled or {}).get("environment", {})
          line = {
              "job": "${{ matrix.job }}",
              "attempt": "${{ github.run_attempt }}",
              "cpu": env.get("cpu"),
              "avx512f": env.get("avx512f"),
              "avx512_features_on": env.get("avx512_features_on"),
              "disabled": os.environ["DISABLED"] or "nothing to disable",
              "import_code": os.environ["IMPORT_CODE"],
              "import_stderr": err.read_text(encoding="utf-8", errors="replace").strip() if err.exists() else None,
              "probe_default": os.environ["PROBE_DEFAULT"],
              "parity_default": os.environ["PARITY_DEFAULT"],
              "probe_disabled": os.environ["PROBE_DISABLED"],
              "parity_disabled": os.environ["PARITY_DISABLED"],
              "mismatches_default": None if default is None else {f["name"]: [f["mismatches"], f["max_ulp"]] for f in default["forms"] if f["mismatches"]},
              "mismatches_disabled": None if disabled is None else {f["name"]: [f["mismatches"], f["max_ulp"]] for f in disabled["forms"] if f["mismatches"]},
              "e2e_default": None if default is None else default["end_to_end_summary"],
              "e2e_disabled": None if disabled is None else disabled["end_to_end_summary"],
          }
          text = json.dumps(line)
          print("NUMERICS_SUMMARY " + text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text + "\n")
          EOF

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.job }}-attempt-${{ github.run_attempt }}
          path: temp/probe/
