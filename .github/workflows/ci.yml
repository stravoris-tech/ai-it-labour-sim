name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Numerics probe
        run: uv run --frozen python tools/numerics_probe.py || true

      - name: Gate
        run: uv run python scripts/gate.py

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: temp/gate/junit.xml
