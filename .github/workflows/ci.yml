name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    name: gate
    # Pinned: moving to a newer image is a deliberate future change (a new glibc can move cross-platform golden checks).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # numpy's AVX-512 kernels differ from libm by 1 ulp and break batch parity; see README "Reproducibility".
      NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
      # Charts render headless on the runner.
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Numerics probe
        run: uv run --frozen python tools/numerics_probe.py || true

      - name: Gate
        run: uv run python scripts/gate.py

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: temp/gate/junit.xml
