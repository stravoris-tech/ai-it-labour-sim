[project]
name = "ai-it-labour-sim"
version = "0.1.0"
description = "A System Dynamics model of AI's impact on IT employment in India and onshore, 2024-2040."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.11"]

[dependency-groups]
dev = [
    "matplotlib>=3.11",
    "mypy",
    "pandas-stubs>=3.0.5.260914",
    "pytest",
    "ruff",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aisim"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["reference", "temp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The model keeps the spec and prototype names: the stock O (onboarding) and the level index l.
"src/aisim/**" = ["E741"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "tools", "scripts", "examples"]
exclude = ["^reference/", "^temp/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow' --strict-markers"
markers = [
    "slow: long-running checks, skipped by default; run with -m slow",
]
