6, 26), rgb(215, 215, 215));"><text x="201" y="326">R</text><text x="201" y="340">Client flight</text></g></g></g><g data-cell-id="title"><g transform="translate(0.5,0.5)"><rect x="20" y="20" width="386" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" font-size="16px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="22" y="42">A3. Vendor distress and client flight</text></g></g></g><g data-cell-id="legend"><g transform="translate(0.5,0.5)"><rect x="20" y="607" width="389" height="67" fill="#fafafa" stroke="#999999" pointer-events="all" style="fill: light-dark(rgb(250, 250, 250), rgb(22, 22, 22)); stroke: light-dark(rgb(153, 153, 153), rgb(106, 106, 106));"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="30" y="628">+ or - on an arrow: the link's polarity.</text><text x="30" y="641">R / B circle: a reinforcing / balancing loop.</text><text x="30" y="654">Box: a stock (it accumulates). Bold text: everything else.</text><text x="30" y="667">Hexagon: a limit on the link beside it.</text></g></g></g><g data-cell-id="caption:1"><g transform="translate(0.5,0.5)"><rect x="439" y="607" width="593" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="441" y="624">A vendor whose margin falls well below normal loses clients and cuts staff; lost clients</text><text x="441" y="637">cut its revenue and margin further. Clients get used to the distress, so the flight fades.</text></g></g></g></g></g></g></svg>