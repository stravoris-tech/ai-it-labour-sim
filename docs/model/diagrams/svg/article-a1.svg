12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="190.5" y="393">Vendor share of</text><text x="190.5" y="407">work</text></g></g></g><g data-cell-id="A1.waiting"><g><rect x="369" y="82" width="123" height="27" fill="#bfdcec" stroke="#0072b2" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(191, 220, 236), rgb(32, 57, 71)); stroke: light-dark(rgb(0, 114, 178), rgb(75, 173, 228));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="430.5" y="100.5">IT work waiting</text></g></g></g><g data-cell-id="A1.loop_gcc"><g><ellipse cx="71" cy="170" rx="51" ry="26" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="71" y="168">R</text><text x="71" y="182">GCC scale</text></g></g></g><g data-cell-id="A1.loop_staffing"><g><ellipse cx="551" cy="169.5" rx="69" ry="41.5" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="551" y="153.5">B</text><text x="551" y="167.5">Staffing</text><text x="551" y="181.5">catches up</text><text x="551" y="195.5">with the work</text></g></g></g><g data-cell-id="title"><g transform="translate(0.5,0.5)"><rect x="20" y="20" width="564" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" font-size="16px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="22" y="42">A1. Why total IT jobs hold while their employer changes</text></g></g></g><g data-cell-id="legend"><g transform="translate(0.5,0.5)"><rect x="20" y="456" width="389" height="54" fill="#fafafa" stroke="#999999" pointer-events="all" style="fill: light-dark(rgb(250, 250, 250), rgb(22, 22, 22)); stroke: light-dark(rgb(153, 153, 153), rgb(106, 106, 106));"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="30" y="477">+ or - on an arrow: the link's polarity.</text><text x="30" y="490">R / B circle: a reinforcing / balancing loop.</text><text x="30" y="503">Box: a stock (it accumulates). Bold text: everything else.</text></g></g></g><g data-cell-id="caption:1"><g transform="translate(0.5,0.5)"><rect x="439" y="456" width="593" height="67" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="441" y="473">AI raises output per worker, so fewer staff are needed for the same work. Work that moves</text><text x="441" y="486">to a GCC still needs people, so the GCC hires as the vendor shrinks. At the same time GCCs</text><text x="441" y="499">win work from vendors and their scale advantage feeds itself, so total IT staff moves less</text><text x="441" y="512">than the split between employers.</text></g></g></g></g></g></g></svg>