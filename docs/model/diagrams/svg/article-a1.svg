vetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="450" y="176">R</text><text x="450" y="190">GCC scale</text></g></g></g><g data-cell-id="A1.loop_staffing"><g><ellipse cx="448" cy="477.5" rx="69" ry="41.5" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="448" y="461.5">B</text><text x="448" y="475.5">Staffing</text><text x="448" y="489.5">catches up</text><text x="448" y="503.5">with the work</text></g></g></g><g data-cell-id="title"><g transform="translate(0.5,0.5)"><rect x="21" y="20" width="564" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" font-size="16px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="23" y="42">A1. Why total IT jobs hold while their employer changes</text></g></g></g><g data-cell-id="legend"><g transform="translate(0.5,0.5)"><rect x="21" y="607" width="389" height="67" fill="#fafafa" stroke="#999999" pointer-events="all" style="fill: light-dark(rgb(250, 250, 250), rgb(22, 22, 22)); stroke: light-dark(rgb(153, 153, 153), rgb(106, 106, 106));"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="31" y="628">+ or - on an arrow: the link's polarity.</text><text x="31" y="641">R / B circle: a reinforcing / balancing loop.</text><text x="31" y="654">Box: a stock (it accumulates). Bold text: everything else.</text><text x="31" y="667">Hexagon: a limit on the link beside it.</text></g></g></g><g data-cell-id="caption:1"><g transform="translate(0.5,0.5)"><rect x="440" y="607" width="593" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="442" y="624">AI raises output per worker, so fewer staff are needed for the same work. At the same time</text><text x="442" y="637">GCCs win work from vendors and their scale advantage feeds itself, so total IT staff moves</text><text x="442" y="650">less than the split between employers.</text></g></g></g></g></g></g></svg>