"><text x="438" y="618">limit: the advantage</text><text x="438" y="631">is capped</text></g></g></g><g data-cell-id="A2.loop_gcc"><g><ellipse cx="439" cy="395" rx="51" ry="33" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="439" y="386">R</text><text x="439" y="400">GCC scale</text><text x="439" y="414">(capped)</text></g></g></g><g data-cell-id="A2.loop_squeeze"><g><ellipse cx="438" cy="320" rx="74" ry="26" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="438" y="318">R</text><text x="438" y="332">Vendor squeeze</text></g></g></g><g data-cell-id="title"><g transform="translate(0.5,0.5)"><rect x="20" y="20" width="237" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" font-size="16px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="22" y="42">A2. The GCC scale loop</text></g></g></g><g data-cell-id="legend"><g transform="translate(0.5,0.5)"><rect x="20" y="680" width="389" height="67" fill="#fafafa" stroke="#999999" pointer-events="all" style="fill: light-dark(rgb(250, 250, 250), rgb(22, 22, 22)); stroke: light-dark(rgb(153, 153, 153), rgb(106, 106, 106));"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="30" y="701">+ or - on an arrow: the link's polarity.</text><text x="30" y="714">R / B circle: a reinforcing / balancing loop.</text><text x="30" y="727">Box: a stock (it accumulates). Bold text: everything else.</text><text x="30" y="740">Hexagon: a limit on the link beside it.</text></g></g></g><g data-cell-id="caption:1"><g transform="translate(0.5,0.5)"><rect x="439" y="680" width="580" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="441" y="697">Every GCC that opens makes the next one easier; the work it takes comes out of vendors'</text><text x="441" y="710">books, and GCC hiring from vendors raises their costs. The advantage is capped: the loop</text><text x="441" y="723">feeds back until about 2032, then sits at its cap, a fixed shift with no further gain.</text></g></g></g></g></g></g></svg>