="A2.viability"><g><rect x="398" y="240" width="130" height="27" fill="#ccc8e1" stroke="#332288" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(204, 200, 225), rgb(64, 61, 82)); stroke: light-dark(rgb(51, 34, 136), rgb(204, 189, 255));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="463" y="258.5">Vendor viability</text></g></g></g><g data-cell-id="A2.limit_cap"><g transform="translate(0.5,0.5)"><path d="M 39.92 308 L 166.08 308 L 186 328 L 166.08 348 L 39.92 348 L 20 328 Z" fill="#ffffff" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="103" y="326">limit: the advantage</text><text x="103" y="339">is capped</text></g></g></g><g data-cell-id="A2.loop_gcc"><g><ellipse cx="343" cy="253" rx="51" ry="33" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="343" y="244">R</text><text x="343" y="258">GCC scale</text><text x="343" y="272">(capped)</text></g></g></g><g data-cell-id="A2.loop_hire"><g><ellipse cx="583" cy="328" rx="74" ry="33" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="583" y="319">R</text><text x="583" y="333">GCCs hire from</text><text x="583" y="347">vendors</text></g></g></g><g data-cell-id="A2.loop_squeeze"><g><ellipse cx="343" cy="178" rx="74" ry="26" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="343" y="176">R</text><text x="343" y="190">Vendor squeeze</text></g></g></g><g data-cell-id="title"><g transform="translate(0.5,0.5)"><rect x="20" y="20" width="237" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" font-size="16px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="22" y="42">A2. The GCC scale loop</text></g></g></g><g data-cell-id="legend"><g transform="translate(0.5,0.5)"><rect x="20" y="614" width="389" height="67" fill="#fafafa" stroke="#999999" pointer-events="all" style="fill: light-dark(rgb(250, 250, 250), rgb(22, 22, 22)); stroke: light-dark(rgb(153, 153, 153), rgb(106, 106, 106));"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="30" y="635">+ or - on an arrow: the link's polarity.</text><text x="30" y="648">R / B circle: a reinforcing / balancing loop.</text><text x="30" y="661">Box: a stock (it accumulates). Bold text: everything else.</text><text x="30" y="674">Hexagon: a limit on the link beside it.</text></g></g></g><g data-cell-id="caption:1"><g transform="translate(0.5,0.5)"><rect x="439" y="614" width="580" height="67" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="441" y="631">The more IT work GCCs hold, the stronger their scale advantage, and the more clients</text><text x="441" y="644">choose them; the work they take comes out of vendors' books, and GCC hiring from vendors</text><text x="441" y="657">raises their costs. The advantage is capped: the loop feeds back until about 2032, then</text><text x="441" y="670">sits at its cap, a fixed shift with no further gain.</text></g></g></g></g></g></g></svg>