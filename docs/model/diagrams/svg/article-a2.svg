b(215, 215, 215));"><text x="558" y="393">Clients choosing</text><text x="558" y="407">GCCs</text></g></g></g><g data-cell-id="A2.costs"><g transform="translate(0.5,0.5)"><rect x="24" y="82" width="108" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#332288" font-family="Helvetica" font-weight="bold" font-size="12px" style="fill: light-dark(rgb(51, 34, 136), rgb(204, 189, 255));"><text x="26" y="100">Vendor costs</text></g></g></g><g data-cell-id="A2.gcc_scale"><g transform="translate(0.5,0.5)"><rect x="276" y="524" width="85" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#882255" font-family="Helvetica" font-weight="bold" font-size="12px" style="fill: light-dark(rgb(136, 34, 85), rgb(252, 164, 208));"><text x="278" y="542">GCC scale</text><text x="278" y="556">advantage</text></g></g></g><g data-cell-id="A2.gcc_share"><g><rect x="496" y="524" width="123" height="42" fill="#e1c8d4" stroke="#882255" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(225, 200, 212), rgb(76, 55, 65)); stroke: light-dark(rgb(136, 34, 85), rgb(252, 164, 208));"/></g><g><g fill="#1A1A1A" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="557.5" y="543">GCC share of IT</text><text x="557.5" y="557">work</text></g></g></g><g data-cell-id="A2.leaving"><g transform="translate(0.5,0.5)"><rect x="20" y="224" width="115" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#CC79A7" font-family="Helvetica" font-weight="bold" font-size="12px" style="fill: light-dark(rgb(204, 121, 167), rgb(168, 97, 136));"><text x="22" y="242">Staff leaving</text><text x="22" y="256">vendors</text></g></g></g><g data-cell-id="A2.margin"><g transform="translate(0.5,0.5)"><rect x="260" y="82" width="115" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#332288" font-family="Helvetica" font-weight="bold" font-size