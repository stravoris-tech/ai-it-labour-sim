7">Hexagon: a limit on the link beside it.</text></g></g></g><g data-cell-id="caption:1"><g transform="translate(0.5,0.5)"><rect x="439" y="607" width="593" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="441" y="624">Clients expect AI gains to show up as lower prices; a ceiling on the AI discount and a</text><text x="441" y="637">floor at cost limit how far prices fall, and vendors that lose share adopt AI faster. Both</text><text x="441" y="650">limits bind only under fast AI.</text></g></g></g></g></g></g></svg>