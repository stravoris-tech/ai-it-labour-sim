t="bold" font-size="16px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="23" y="42">A5. Discouraged entry</text></g></g></g><g data-cell-id="legend"><g transform="translate(0.5,0.5)"><rect x="21" y="456" width="389" height="67" fill="#fafafa" stroke="#999999" pointer-events="all" style="fill: light-dark(rgb(250, 250, 250), rgb(22, 22, 22)); stroke: light-dark(rgb(153, 153, 153), rgb(106, 106, 106));"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="31" y="477">+ or - on an arrow: the link's polarity.</text><text x="31" y="490">R / B circle: a reinforcing / balancing loop.</text><text x="31" y="503">Box: a stock (it accumulates). Bold text: everything else.</text><text x="31" y="516">Hexagon: a limit on the link beside it.</text></g></g></g><g data-cell-id="caption:1"><g transform="translate(0.5,0.5)"><rect x="440" y="456" width="554" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-size="11px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="442" y="473">High IT unemployment puts students off IT; fewer graduates arrive years later,</text><text x="442" y="486">unemployment falls and prospects improve. Two delays, perception and study, mean the</text><text x="442" y="499">correction arrives years late.</text></g></g></g></g></g></g></svg>